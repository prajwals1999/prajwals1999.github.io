<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Particle Sandbox</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0d0e15;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        header {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            pointer-events: none;
        }
        h1 {
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }
        p {
            font-size: 0.9rem;
            color: #8b8ea8;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 15px;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 20px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        button {
            background: transparent;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        button:hover {
            background: #00ffcc;
            color: #0d0e15;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.6);
        }
    </style>
</head>
<body>

    <header>
        <h1>Interactive Sandbox</h1>
        <p>Move your mouse to draw. Click to burst waves.</p>
    </header>

    <div class="controls">
        <button id="clearBtn">Clear Canvas</button>
        <button id="colorBtn">Change Theme</button>
    </div>

    <canvas id="sandboxCanvas"></canvas>

    <script>
        const canvas = document.getElementById('sandboxCanvas');
        const ctx = canvas.getContext('2d');
        
        let particles = [];
        let hue = 0;
        let currentTheme = 'rainbow';

        // Resize canvas dynamically
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y, speedX, speedY) {
                this.x = x;
                this.y = y;
                // Randomized sizes and speeds
                this.size = Math.random() * 8 + 2;
                this.speedX = speedX || Math.random() * 3 - 1.5;
                this.speedY = speedY || Math.random() * 3 - 1.5;
                
                if (currentTheme === 'rainbow') {
                    this.color = `hsl(${hue}, 100%, 60%)`;
                } else {
                    this.color = `hsl(180, 100%, 60%)`; // Cyan theme
                }
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.size > 0.2) this.size -= 0.1; // Shrink over time
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Mouse Move Effect
        window.addEventListener('mousemove', (e) => {
            for (let i = 0; i < 2; i++) {
                particles.push(new Particle(e.x, e.y));
            }
        });

        // Click Burst Effect
        window.addEventListener('click', (e) => {
            if (e.target.tagName === 'BUTTON') return; // Ignore control buttons
            for (let i = 0; i < 30; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 2;
                const speedX = Math.cos(angle) * speed;
                const speedY = Math.sin(angle) * speed;
                particles.push(new Particle(e.x, e.y, speedX, speedY));
            }
        });

        // Animation Loop
        function animate() {
            // Semi-transparent clear creates a glowing trail effect
            ctx.fillStyle = 'rgba(13, 14, 21, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                
                // Remove dead particles
                if (particles[i].size <= 0.2) {
                    particles.splice(i, 1);
                    i--;
                }
            }
            hue += 2;
            requestAnimationFrame(animate);
        }
        animate();

        // Control Panel Features
        document.getElementById('clearBtn').addEventListener('click', () => {
            particles = [];
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        document.getElementById('colorBtn').addEventListener('click', () => {
            currentTheme = currentTheme === 'rainbow' ? 'cyan' : 'rainbow';
        });
    </script>
</body>
</html>
