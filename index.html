<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevShell // Guest Terminal</title>
    <style>
        body {
            background-color: #0a0e14;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            padding: 30px;
            margin: 0;
            line-height: 1.5;
        }
        .terminal-wrapper {
            max-width: 800px;
            margin: 0 auto;
        }
        .header-text {
            color: #00bcff;
            margin-bottom: 20px;
            white-space: pre;
        }
        .history {
            margin-bottom: 15px;
        }
        .line {
            margin-bottom: 8px;
        }
        .input-line {
            display: flex;
            align-items: center;
        }
        .prompt {
            color: #ff0055;
            margin-right: 10px;
            font-weight: bold;
        }
        input {
            background: transparent;
            border: none;
            color: #00ff66;
            font-family: inherit;
            font-size: 1rem;
            flex-grow: 1;
            outline: none;
        }
        .system-response {
            color: #abb2bf;
            padding-left: 15px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

<div class="terminal-wrapper">
    <!-- Retro ASCII Brand Banner -->
    <div class="header-text">
 _  _  ____  __    __     __  
( )/ )(  __)(  )  (  )   /  \ 
 )  (  ) _)  / (_/\/ (_/\(  O )
(_)\_)(____)\____/\____/ \__/ 
Welcome to GuestShell v2.6. Type 'help' for core execution links.
    </div>

    <!-- Live Terminal Activity Log -->
    <div class="history" id="terminalHistory"></div>

    <!-- Active User Entry Segment -->
    <div class="input-line">
        <span class="prompt">guest@github.io:~$</span>
        <input type="text" id="cmdInput" autofocus autocomplete="off" spellcheck="false">
    </div>
</div>

<script>
    const cmdInput = document.getElementById('cmdInput');
    const history = document.getElementById('terminalHistory');

    // Available operational commands
    const commands = {
        help: "Supported modules: <br>• <b>about</b> - Reveal developer background profile.<br>• <b>skills</b> - Output structural project technology stacks.<br>• <b>clear</b> - Reset active screen history.",
        about: "Loading target profile... Status: Active.<br>I am a creative developer deploying static experiments onto GitHub Pages.",
        skills: "Technological Competencies:<br> [■■■■■■■■□□] Frontend Engineering (HTML/CSS/JS)<br> [■■■■■■□□□□] Automation Engines (Git/CI Actions)"
    };

    // Keep execution focused on input block
    document.addEventListener('click', () => cmdInput.focus());

    cmdInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            const rawValue = this.value.trim();
            const cleanCmd = rawValue.toLowerCase();
            
            if (rawValue === "") return;

            // Render current command line
            const userEcho = document.createElement('div');
            userEcho.className = 'line';
            userEcho.innerHTML = `<span class="prompt">guest@github.io:~$</span> ${rawValue}`;
            history.appendChild(userEcho);

            // Execute custom commands
            const output = document.createElement('div');
            output.className = 'system-response';

            if (cleanCmd === 'clear') {
                history.innerHTML = '';
            } else if (commands[cleanCmd]) {
                output.innerHTML = commands[cleanCmd];
                history.appendChild(output);
            } else {
                output.innerHTML = `Command execution error: '${rawValue}' not recognized. Type 'help' for diagnostics.`;
                history.appendChild(output);
            }

            this.value = '';
            window.scrollTo(0, document.body.scrollHeight);
        }
    });
</script>

</body>
</html>
